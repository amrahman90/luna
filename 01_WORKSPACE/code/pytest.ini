[pytest]
# LUNARVOID test-suite pin (task C4). This file deliberately lives in
# 01_WORKSPACE/code/ — the repo root must stay clean per AGENTS.md rule 2,
# so there is NO pytest.ini/pyproject at the root. pytest finds this file
# by walking up from the test paths (tests/ -> code/), making rootdir
# deterministic at 01_WORKSPACE/code.
minversion = 7.0
testpaths = tests
addopts = -p no:cacheprovider -p no:randomly --strict-markers
# (-q intentionally NOT pinned here: the canonical invocation
# `pytest 01_WORKSPACE/code/tests/ -q` supplies it; doubling it to -qq
# would hide the pass/skip summary line.)
# Determinism pins:
#   - collection order: pytest's filesystem order is already deterministic;
#     "-p no:randomly" additionally neutralises pytest-randomly if it ever
#     gets installed.
#   - no:cacheprovider: no .pytest_cache directories written into the repo.
#   - no network: enforced at runtime by the autouse socket fixture in
#     tests/conftest.py (stronger than any ini flag).
# Offline: nothing in this suite dials out; localdata tests skip when
# LUNARVOID_DATA (default ~/lunarvoid/data) lacks the artifact.
markers =
    localdata: needs artifacts under LUNARVOID_DATA (default ~/lunarvoid/data); skips with a reason when absent (CI-safe)
    slow: wall time >~20 s (detector CLI or smoke re-runs)
